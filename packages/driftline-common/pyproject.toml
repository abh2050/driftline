[project]
name = "driftline-common"
version = "0.1.0"
description = "Shared schemas, decision interface, telemetry, audit and config for Driftline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftline_common"]
