[project]
name = "orchestrator"
version = "0.1.0"
description = "Driftline orchestrator: Agent Framework workflow over Foundry agents"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "agent-framework-core==1.21.0", "agent-framework-foundry==1.14.1", "mcp==1.30.0", "azure-cosmos==4.17.1", "azure-storage-blob==12.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
driftline-common = { workspace = true }
