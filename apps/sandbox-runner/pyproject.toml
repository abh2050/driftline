[project]
name = "sandbox-runner"
version = "0.1.0"
description = "Validates candidate fixes: builds patient-rag in process and runs layer 1"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "patient-rag", "azure-ai-evaluation==1.18.8",
                "azure-storage-blob==12.31.0"]

[project.scripts]
sandbox-runner = "sandbox_runner.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_runner"]

[tool.uv.sources]
driftline-common = { workspace = true }
patient-rag = { workspace = true }
