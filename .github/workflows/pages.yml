name: pages

# Publishes docs/site (index.html, video, screenshots, diagrams) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Assemble the site (published files only)
        run: |
          mkdir -p _site
          cp docs/site/index.html _site/
          cp -R docs/site/assets docs/site/screenshots docs/site/diagrams _site/
          mkdir -p _site/video && cp docs/site/video/brag.mp4 docs/site/video/brag.jpg _site/video/
          rm -f _site/assets/higgsfield.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
