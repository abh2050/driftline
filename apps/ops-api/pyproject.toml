[project]
name = "ops-api"
version = "0.1.0"
description = "Human-facing Driftline API: incidents, approvals, live stream, chat, demo controls, MCP"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "mcp==1.30.0", "azure-cosmos==4.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_api"]

[tool.uv.sources]
driftline-common = { workspace = true }
