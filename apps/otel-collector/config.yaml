# Driftline OpenTelemetry Collector (spec 5.1.9, ADR 0003).
# Every service sends OTLP here; the collector tail-samples traces, computes span metrics,
# and exports to Azure Monitor's native OTLP ingestion (DCE + DCR) with its managed identity.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  azure_auth:
    managed_identity:
      client_id: ${env:AZURE_CLIENT_ID}
    scopes:
      - https://monitor.azure.com/.default

receivers:
  # the collector's own metrics (otelcol_exporter_send_failed_*), for the drop-rate alert
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 512
    timeout: 5s
  # Keep all errors, all slow traces, every trace that belongs to an incident, and 10%
  # of everything else.
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 50
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency:
          threshold_ms: ${env:OTEL_SLOW_TRACE_MS:-3000}
      - name: incidents
        type: string_attribute
        string_attribute: { key: driftline.incident_id, values: [".+"], enabled_regex_matching: true }
      - name: decisions
        type: string_attribute
        string_attribute: { key: driftline.decision_type, values: [".+"], enabled_regex_matching: true }
      - name: baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }
  # FastAPI's per-request internal spans and ingest's per-event HTTP server span carried
  # most of the Log Analytics volume (about 1 GB a day) and no diagnostic value. Errors stay.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^fastapi\\.") and status.code != STATUS_CODE_ERROR'
        - 'resource.attributes["service.name"] == "ingest" and name == "POST /events/telemetry" and status.code != STATUS_CODE_ERROR'
  cumulative_to_delta:
  resource/env:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT:-dev}
        action: upsert

connectors:
  forward/sample:
  # Request rate, error rate and latency histograms per service, agent, decision type and
  # model deployment, computed before sampling so the numbers are unbiased.
  span_metrics:
    histogram:
      exponential:
        max_size: 160
    dimensions:
      - name: gen_ai.agent.name
      - name: driftline.decision_type
      - name: gen_ai.request.model
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    metrics_flush_interval: 30s

exporters:
  otlp_http/azuremonitor:
    traces_endpoint: ${env:DCE_LOGS_ENDPOINT}/datacollectionRules/${env:OTLP_DCR_IMMUTABLE_ID}/streams/Microsoft-OTLP-Traces/otlp/v1/traces
    logs_endpoint: ${env:DCE_LOGS_ENDPOINT}/datacollectionRules/${env:OTLP_DCR_IMMUTABLE_ID}/streams/Microsoft-OTLP-Logs/otlp/v1/logs
    metrics_endpoint: ${env:DCE_METRICS_ENDPOINT}/datacollectionRules/${env:OTLP_DCR_IMMUTABLE_ID}/streams/Custom-Metrics-Otel/otlp/v1/metrics
    auth:
      authenticator: azure_auth
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 5000
  debug:
    verbosity: basic

service:
  extensions: [health_check, azure_auth]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, resource/env]
      exporters: [span_metrics, forward/sample]
    traces/out:
      receivers: [forward/sample]
      processors: [filter/noise, tail_sampling, batch]
      exporters: [otlp_http/azuremonitor]
    metrics:
      receivers: [otlp, span_metrics, prometheus/self]
      processors: [memory_limiter, resource/env, cumulative_to_delta, batch]
      exporters: [otlp_http/azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/azuremonitor]
