[project]
name = "driftline"
version = "0.1.0"
description = "Multi agent system that detects RAG quality drift and opens fix PRs"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "patient-rag", "traffic-gen", "router", "ingest", "detector", "replay", "orchestrator", "github_mcp_proxy", "kql_tool", "sandbox_runner", "ops-api"]

[project.scripts]
driftline-eval = "evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*", "apps/patient-rag", "apps/traffic-gen", "apps/router", "apps/ingest", "apps/detector", "apps/replay", "apps/orchestrator", "apps/github-mcp", "apps/kql-tool", "apps/sandbox-runner", "apps/ops-api"]

[tool.uv.sources]
driftline-common = { workspace = true }
patient-rag = { workspace = true }
traffic-gen = { workspace = true }
router = { workspace = true }
ingest = { workspace = true }
detector = { workspace = true }
replay = { workspace = true }
orchestrator = { workspace = true }
github-mcp-proxy = { workspace = true }
kql-tool = { workspace = true }
sandbox-runner = { workspace = true }
ops-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/console"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["driftline_common", "patient_rag", "traffic_gen", "router", "ingest", "detector", "replay", "orchestrator", "github_mcp_proxy", "kql_tool", "sandbox_runner", "synth", "scripts", "evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]
"synth/**" = ["S311"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["packages", "apps/patient-rag/src", "apps/traffic-gen/src", "apps/router/src", "apps/ingest/src", "apps/detector/src", "apps/replay/src", "apps/orchestrator/src", "apps/github-mcp/src", "apps/kql-tool/src", "apps/sandbox-runner/src", "apps/ops-api/src", "evals", "synth", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["packages/driftline-common/src", "apps/patient-rag/src", "apps/traffic-gen/src", "apps/router/src", "apps/ingest/src", "apps/detector/src", "apps/replay/src", "apps/orchestrator/src", "apps/github-mcp/src", "apps/kql-tool/src", "apps/sandbox-runner/src", "apps/ops-api/src", "."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
norecursedirs = ["node_modules", ".next", ".venv", "apps/console", "data", "synth/cache"]

[dependency-groups]
dev = [
    "azure-ai-evaluation==1.18.8",
    "azure-mgmt-resource==26.0.0",
    "azure-monitor-query==2.0.0",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]
