# patient-rag behavior (spec 5.1.1). Faults in ../faults/*.yaml override these keys at runtime.
config_revision: 2          # bumped by every Driftline fix PR to force a redeploy (ADR 0006)
chunk_size: 512            # tokens per chunk (cl100k)
chunk_overlap: 64
top_k: 8                    # pinned by Driftline inc-20261010185319-001262
embedding_deployment: text-embedding-3-small
embedding_dimensions: 1536
chat_deployment: gpt-4.1-mini
prompt_version: v3
reranker_enabled: false
reranker_deployment: cohere-rerank-fast
rerank_candidates: 20      # vector hits fetched before reranking down to top_k
chat_route: direct         # direct | gateway (through APIM; used by F7)
max_answer_tokens: 400
groundedness_sample_rate: 0.10
judge_deployment: gpt-5.4-mini
index_prefix: cfw
