[project]
name = "replay"
version = "0.1.0"
description = "Replays synthetic telemetry onto the telemetry topic"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]

[tool.uv.sources]
driftline-common = { workspace = true }
