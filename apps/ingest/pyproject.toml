[project]
name = "ingest"
version = "0.1.0"
description = "Telemetry ingest: one-minute windows into Cosmos"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "azure-cosmos==4.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.uv.sources]
driftline-common = { workspace = true }
