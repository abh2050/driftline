[project]
name = "traffic-gen"
version = "0.1.0"
description = "Scheduled synthetic traffic and canary questions for patient-rag"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "httpx==0.28.1"]

[project.scripts]
traffic-gen = "traffic_gen.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_gen"]

[tool.uv.sources]
driftline-common = { workspace = true }
