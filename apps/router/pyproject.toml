[project]
name = "router"
version = "0.1.0"
description = "Driftline router: every D1-D6 decision through one DecisionClient service"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "azure-monitor-ingestion==1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.uv.sources]
driftline-common = { workspace = true }
