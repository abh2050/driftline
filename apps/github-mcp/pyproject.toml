[project]
name = "github-mcp-proxy"
version = "0.1.0"
description = "Token proxy in front of GitHub's official MCP server (HTTP mode)"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "azure-keyvault-secrets==4.11.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_mcp_proxy"]

[tool.uv.sources]
driftline-common = { workspace = true }
