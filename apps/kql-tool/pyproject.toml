[project]
name = "kql-tool"
version = "0.1.0"
description = "MCP server exposing named, parameterized KQL queries over Log Analytics"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "uvicorn==0.54.0", "mcp==1.30.0", "azure-monitor-query==2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kql_tool"]

[tool.uv.sources]
driftline-common = { workspace = true }
