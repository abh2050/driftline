[project]
name = "patient-rag"
version = "0.1.0"
description = "Target RAG application monitored by Driftline (Cascade Forge Works docs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-evaluation==1.18.8",
    "azure-search-documents==12.0.0",
    "driftline-common",
    "httpx==0.28.1",
    "tiktoken==0.14.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_rag"]

[tool.uv.sources]
driftline-common = { workspace = true }
