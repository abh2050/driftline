[project]
name = "detector"
version = "0.1.0"
description = "EWMA + CUSUM drift detector with D1 verification"
requires-python = ">=3.12,<3.13"
dependencies = ["driftline-common", "ingest", "uvicorn==0.54.0", "azure-cosmos==4.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.uv.sources]
driftline-common = { workspace = true }
ingest = { workspace = true }
