# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: driftline
metadata:
  template: driftline@0.1.0
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    shell: sh
    run: uv run python -m scripts.entra_app pre
  postprovision:
    shell: sh
    run: uv run python -m scripts.entra_app post
  predeploy:
    shell: sh
    run: azd env set GIT_COMMIT "$(git rev-parse --short HEAD)"
services:
  otel-collector:
    project: apps/otel-collector
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
  patient-rag:
    project: apps/patient-rag
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - GIT_COMMIT=${GIT_COMMIT}
  traffic-gen:
    project: apps/traffic-gen
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
  router:
    project: apps/router
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
  ingest:
    project: apps/ingest
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
  detector:
    project: apps/detector
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
  replay:
    project: apps/replay
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
