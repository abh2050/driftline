name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q
      - name: synthetic data determinism
        run: ./scripts/check-synth-determinism.sh
      - name: layer 1 offline
        run: uv run driftline-eval layer1 --label baseline --offline

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: bicep lint
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep --diagnostics-format sarif > bicep.sarif
          az bicep build --file infra/main.bicep --stdout > /dev/null
